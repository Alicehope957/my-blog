# ============================================================
#  Fluid 主题配置
#  这里只写「要覆盖」的项，其余自动使用主题默认值
#  主题默认值一览: node_modules/hexo-theme-fluid/_config.yml
#  中文配置指南: https://hexo.fluid-dev.com/docs/guide/
# ============================================================

# ---------------- 导航栏 ----------------
navbar:
  blog_title: "奇思随想"
  menu:
    - { key: "home",     link: "/",           icon: "iconfont icon-home-fill" }
    - { key: "archive",  link: "/archives/",  icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag",      link: "/tags/",      icon: "iconfont icon-tags-fill" }
    - { key: "about",    link: "/about/",     icon: "iconfont icon-user-fill" }

# ---------------- 首页副标题（多行会随机显示一句）----------------
index:
  banner_img: /img/bg/Star.webp
  slogan:
    enable: true
    text:
      - "泠RinOo的博客"
      - "笔记 / 代码 / 日志"
      - "偶尔刷新杂谈 / 吐槽"
      - "悟已往之不谏，知来者之可追"
      - "只要想起一生中后悔的事，梅花便落满了南山"

# ---------------- 页脚 ----------------
footer:
  content: '
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a>
    <i class="iconfont icon-love"></i>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a>
  '

# ---------------- 代码块 ----------------
code:
  copy_btn: true
  language:
    enable: true
    default: "TEXT"
  highlight:
    enable: true
    # 想显示「复制按钮 + 语言标签」就把 line_number 改成 false
    # （二选一：行号 和 复制按钮 目前不能同时出现）
    line_number: true
    lib: "highlightjs"
    highlightjs:
      style: "github gist"
      style_dark: "github-dark"

# ---------------- 文章页 ----------------
post:
  meta:
    author:  # 作者，优先根据 front-matter 里 author 字段，其次是 hexo 配置中 author 值
      enable: false
    date:  # 文章日期，优先根据 front-matter 里 date 字段，其次是 md 文件日期
      enable: true
      format: "YYYY/MM/DD"  # 格式参照 ISO-8601 日期格式化
    wordcount:  # 字数统计
      enable: true
      format: "{} 字"  # 显示的文本，{}是数字的占位符（必须包含)，下同
    min2read:  # 阅读时间
      enable: false
      format: "{} 分钟"
    views:  # 阅读次数
      enable: true
      source: "busuanzi"  # 统计数据来源，可选：leancloud | busuanzi | openkounter   注意不蒜子会间歇抽风
      format: "本篇文章已被阅读{} 次"
  # 右侧目录
  toc:
    enable: true
  # 图片点击放大
  image_zoom:
    enable: true
  comments:
    enable: true
    type: waline

# ---------------- 友链页（暂时用不上，关掉避免多一个空页面）----------------
links:
  enable: false

# ---------------- 关于页 ----------------
about:
  name: "泠RinOo"
  intro: "科技数码 · ACGN爱好者"
  avatar: /img/avatar.png
  # 想加图标就去这里查 css class: https://hexo.fluid-dev.com/docs/icon/
  comments:
    enable: true
    type: waline
  banner_img: 'https://img.rin3water.xyz/AboutIMG1.webp'
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/Alicehope957", tip: "GitHub" }

# ---------------- Waline ----------------
waline:
  serverURL: "https://waline.rin3water.xyz"
  path: window.location.pathname
  
# ---------------- SEO ----------------
# 输出 canonical 标签，告诉 搜索引擎哪个才是正式地址
# 依赖 _config.yml 里的 url，换域名后 canonical 会自动跟着变
canonical:
  enable: true

# ---------------- 自定义样式 ----------------
custom_css:
  # 加载本地自托管的 KaTeX 公式样式（不依赖境外 CDN）
  - /css/katex.min.css
  - /css/custom.css
  # 加载 Live2D Widget 样式
  - /live2d-widget/waifu.css

# ---------------- 自定义脚本 ----------------

custom_js:
  # 加载Live2d Widget 脚本
  - /live2d-widget/hit-precision.js
  - /live2d-widget/autoload.js
